{{- if .Values.serviceMonitor.enabled -}}
# Only installed if prometheus-operator is present. The bare-pod
# Prometheus annotations on each component cover the
# annotation-based scrape pattern when prometheus-operator isn't.
{{- range $comp := list "operator" "mirror" "witness" "cosigner" -}}
{{- $section := index $.Values $comp -}}
{{- if $section.enabled -}}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "stele.fullname" $ }}-{{ $comp }}
  {{- if $.Values.serviceMonitor.namespace }}
  namespace: {{ $.Values.serviceMonitor.namespace }}
  {{- end }}
  labels:
    {{- include "stele.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
    {{- with $.Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $comp }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $.Values.serviceMonitor.interval }}
      scrapeTimeout: {{ $.Values.serviceMonitor.scrapeTimeout }}
{{- end -}}
{{- end -}}
{{- end -}}
