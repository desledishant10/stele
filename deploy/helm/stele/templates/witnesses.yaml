{{- if .Values.witnesses.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stele.fullname" . }}-witness
  labels:
    {{- include "stele.labels" . | nindent 4 }}
    app.kubernetes.io/component: witness
spec:
  serviceName: {{ include "stele.fullname" . }}-witness
  replicas: {{ .Values.witnesses.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: witness
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        {{- include "stele.labels" . | nindent 8 }}
        app.kubernetes.io/component: witness
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.witnesses.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        {{- include "stele.podSecurityContext" . | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Spread the witnesses across distinct nodes so a single
      # node failure can't take all of them down. The point of
      # the witness mesh is independent failure domains.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: witness
      containers:
        - name: witness
          image: {{ include "stele.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "stele.containerSecurityContext" . | nindent 12 }}
          command: ["stele-witness"]
          args:
            - --addr=:{{ .Values.witnesses.service.port }}
            - --dir=/var/lib/stele
            # Per-pod identity: use the StatefulSet ordinal hostname so
            # each witness has a stable, unique ID. `hostname -s`
            # returns e.g. `<release>-stele-witness-0`.
            - --id=$(HOSTNAME)
            - --gossip-every={{ .Values.witnesses.gossipInterval }}
            - --pq-mode={{ .Values.operator.pqMode }}
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STELE_LOG_FORMAT
              value: json
          ports:
            - name: http
              containerPort: {{ .Values.witnesses.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.witnesses.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/stele
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "stele.labels" . | nindent 10 }}
          app.kubernetes.io/component: witness
      spec:
        accessModes: [{{ .Values.witnesses.persistence.accessMode }}]
        {{- if .Values.witnesses.persistence.storageClass }}
        storageClassName: {{ .Values.witnesses.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.witnesses.persistence.size }}
---
# Headless service: gives every pod a stable DNS name so the
# operator can register each witness by its StatefulSet ordinal.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stele.fullname" . }}-witness
  labels:
    {{- include "stele.labels" . | nindent 4 }}
    app.kubernetes.io/component: witness
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.witnesses.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: witness
{{- end }}
