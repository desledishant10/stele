{{- if and .Values.mirror.enabled .Values.operator.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stele.fullname" . }}-mirror
  labels:
    {{- include "stele.labels" . | nindent 4 }}
    app.kubernetes.io/component: mirror
spec:
  serviceName: {{ include "stele.fullname" . }}-mirror
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mirror
  template:
    metadata:
      labels:
        {{- include "stele.labels" . | nindent 8 }}
        app.kubernetes.io/component: mirror
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.mirror.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        {{- include "stele.podSecurityContext" . | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mirror
          image: {{ include "stele.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "stele.containerSecurityContext" . | nindent 12 }}
          command: ["stele-mirror"]
          args:
            - --addr=:{{ .Values.mirror.service.port }}
            - --dir=/var/lib/stele
            - --upstream=http://{{ include "stele.fullname" . }}-operator:{{ .Values.operator.service.port }}
            - --poll={{ .Values.mirror.pollInterval }}
          env:
            - name: STELE_LOG_FORMAT
              value: json
          ports:
            - name: http
              containerPort: {{ .Values.mirror.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mirror.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/stele
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "stele.labels" . | nindent 10 }}
          app.kubernetes.io/component: mirror
      spec:
        accessModes: [{{ .Values.mirror.persistence.accessMode }}]
        {{- if .Values.mirror.persistence.storageClass }}
        storageClassName: {{ .Values.mirror.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mirror.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stele.fullname" . }}-mirror
  labels:
    {{- include "stele.labels" . | nindent 4 }}
    app.kubernetes.io/component: mirror
spec:
  type: {{ .Values.mirror.service.type }}
  ports:
    - name: http
      port: {{ .Values.mirror.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mirror
{{- end }}
