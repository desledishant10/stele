{{- if .Values.cosigners.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stele.fullname" . }}-cosigner
  labels:
    {{- include "stele.labels" . | nindent 4 }}
    app.kubernetes.io/component: cosigner
spec:
  serviceName: {{ include "stele.fullname" . }}-cosigner
  replicas: {{ .Values.cosigners.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cosigner
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        {{- include "stele.labels" . | nindent 8 }}
        app.kubernetes.io/component: cosigner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.cosigners.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        {{- include "stele.podSecurityContext" . | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Like witnesses, cosigners want independent failure domains —
      # the point of a t-of-N quorum is no single node failure can
      # disrupt the quorum.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: cosigner
      containers:
        - name: cosigner
          image: {{ include "stele.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "stele.containerSecurityContext" . | nindent 12 }}
          command: ["stele-cosigner"]
          args:
            - --addr=:{{ .Values.cosigners.service.port }}
            - --dir=/var/lib/stele
            - --id=$(HOSTNAME)
            - --pq-mode={{ .Values.operator.pqMode }}
            {{- if .Values.cosigners.trustedCallers }}
            - --trusted-caller={{ join "," .Values.cosigners.trustedCallers }}
            {{- end }}
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STELE_LOG_FORMAT
              value: json
          ports:
            - name: http
              containerPort: {{ .Values.cosigners.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.cosigners.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/stele
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "stele.labels" . | nindent 10 }}
          app.kubernetes.io/component: cosigner
      spec:
        accessModes: [{{ .Values.cosigners.persistence.accessMode }}]
        {{- if .Values.cosigners.persistence.storageClass }}
        storageClassName: {{ .Values.cosigners.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.cosigners.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stele.fullname" . }}-cosigner
  labels:
    {{- include "stele.labels" . | nindent 4 }}
    app.kubernetes.io/component: cosigner
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.cosigners.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cosigner
{{- end }}
