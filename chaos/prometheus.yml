# Prometheus config for the chaos rig.
#
# Scrapes every stele daemon's /metrics endpoint over the docker
# network. Mirror is included so we can watch replication lag during
# partitions. Toxiproxy itself exposes minimal metrics — not scraped.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: stele
    static_configs:
      - targets:
          - "operator:8080"
        labels:
          component: steled
      - targets:
          - "witness-a:9090"
        labels:
          component: witness
          witness_id: witness-a
      - targets:
          - "witness-b:9090"
        labels:
          component: witness
          witness_id: witness-b
      - targets:
          - "witness-c:9090"
        labels:
          component: witness
          witness_id: witness-c
      - targets:
          - "mirror:8444"
        labels:
          component: mirror
    metrics_path: /metrics
